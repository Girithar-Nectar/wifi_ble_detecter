name: wifi_ble_detector
description: A Flutter app to detect nearby WiFi and Bluetooth devices with distance tracking and notifications.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  attendance_tracker:
    path: packages/attendance_tracker
  
  # State Management
  get: ^4.6.6

  # WiFi and Bluetooth Detection
  wifi_scan: ^0.4.0
  flutter_blue_plus: ^2.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  
  # Location Services
  geolocator: ^13.0.2
  
  #Shared Prefs
  shared_preferences: ^2.5.3
  



  
  # Permissions
  permission_handler: ^11.3.0
  


  #Logger
  logger: ^2.6.0
  
  # UI Components
  cupertino_icons: ^1.0.2

  #Tts
  flutter_tts: ^4.2.3



  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true 