name: wifi_ble_detector
description: A Flutter app to detect nearby WiFi and Bluetooth devices with distance tracking and notifications.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  attendance_tracker:
    path: ../


  
  # UI Components
  cupertino_icons: ^1.0.2

  connectivity_plus: ^6.1.4
  vibration: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true 